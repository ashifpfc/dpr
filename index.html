<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PFC DPR System</title>
<meta name="description" content="PFC Daily Progress Report system">
<meta name="theme-color" content="#1e2761">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PFC DPR">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; padding: 0; background: #ffffff; overflow: hidden; }
  * { box-sizing: border-box; }

  #frame {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: 0; background: #ffffff;
  }

  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1e2761; gap: 18px; transition: opacity .35s ease;
    z-index: 20;
  }
  #splash img { width: 96px; height: 96px; }
  #splash .name { color: #fff; font: 600 17px/1.3 -apple-system, Segoe UI, Roboto, Arial, sans-serif; letter-spacing: .2px; }
  #splash .bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: #fff; border-radius: 3px; animation: load 1.1s ease-in-out infinite; }
  @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  #splash.hide { opacity: 0; pointer-events: none; }

  #offline {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #fff; gap: 10px; text-align: center; padding: 24px; z-index: 15;
    font: 500 15px/1.5 -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: #1e2761;
  }
  #offline.show { display: flex; }
  #offline button {
    margin-top: 6px; padding: 10px 22px; border-radius: 24px; border: 0; background: #1e2761; color: #fff;
    font: 600 14px -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  #installBtn {
    position: fixed; right: 16px; bottom: 16px; z-index: 30;
    display: none; align-items: center; gap: 8px;
    background: #1e2761; color: #fff; border: 0; border-radius: 28px;
    padding: 12px 18px; font: 600 14px -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    box-shadow: 0 6px 18px rgba(30,39,97,.35); cursor: pointer;
  }
  #installBtn.show { display: inline-flex; }
  #installBtn svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div id="splash">
  <img src="icons/icon-512.png" alt="PFC">
  <div class="name">PFC DPR System</div>
  <div class="bar"><i></i></div>
</div>

<div id="offline">
  <div>No internet connection.<br>Please check your connection and try again.</div>
  <button onclick="location.reload()">Retry</button>
</div>

<button id="installBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
  Install App
</button>

<iframe id="frame" src="https://script.google.com/macros/s/AKfycbzQ243hBBhU8oHH_WDpKu9v0-AfJh9UCQxxn9luNoEoqgihwH_Zk0sECPZK_85j1IaY/exec"
  title="PFC DPR System" allow="clipboard-read; clipboard-write"></iframe>

<script>
  var frame = document.getElementById('frame');
  var splash = document.getElementById('splash');
  var offline = document.getElementById('offline');

  function hideSplash(){ splash.classList.add('hide'); }
  frame.addEventListener('load', hideSplash);
  // fallback in case the load event doesn't fire inside some embedded contexts
  setTimeout(hideSplash, 4000);

  function checkOnline(){
    if (!navigator.onLine) offline.classList.add('show');
    else offline.classList.remove('show');
  }
  window.addEventListener('online', checkOnline);
  window.addEventListener('offline', checkOnline);
  checkOnline();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  // Custom one-tap install button (Android / desktop Chrome, Edge)
  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });
  installBtn.addEventListener('click', function () {
    installBtn.classList.remove('show');
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.finally ? deferredPrompt.finally(function(){ deferredPrompt = null; }) : (deferredPrompt = null);
  });
  window.addEventListener('appinstalled', function () {
    installBtn.classList.remove('show');
  });
</script>
</body>
</html>
